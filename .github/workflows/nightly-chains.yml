name: Nightly chains (warm roots as a matrix)

# EXTERNAL DISPATCHER for the warm root chains (lib/warm-chains.js ROOT_CHAINS).
#
# Until now api/warm.js dispatched all ~41 roots from inside the 22:00 UTC Vercel cron
# invocation: staggered waves of 4 every 9 s, then a 280 s drain to HEAR their reports. Two
# structural problems came with that:
#   • every root ran CONCURRENTLY once dispatched (the waves only spread the starts), so the
#     peak was 30-40 simultaneous /api/tracker invocations — the Fluid-instance OOM kills of
#     2026-08-07 → 08-19 and the FMP burst-429s that exiled evidencetick/revarchive to
#     evidence-tick.yml;
#   • a chain that outlived the drain was "running-past-warm": its outcome reached op=health
#     only if its own invocation survived to persist warm/chains/<name>.json. Nothing e-mailed
#     anyone when it did not.
#
# Here each root is ONE matrix job calling the SAME single-chain endpoint
# (op=warmchain&name=<root>, which runs the chain's ordered steps inside its own tracker
# invocation — ordering still lives in the callee, nothing changes server-side):
#   • max-parallel: 2 — at most two chain invocations (plus their step children) in flight.
#     It was 4 (the in-process WAVE width) until 2026-10-02, when the full manual run lost
#     capture, universe, pulse, pattern and pitdata to FUNCTION_INVOCATION_FAILED 500s whose
#     timestamps clustered at the same instants (22:56:28-33 ×3, 23:00:23-24 ×2): one Fluid
#     instance hosting several heavy invocations died (OOM) and took every co-located request
#     with it — the 2026-10-01 insidercluster signature. Halving the width halves what can
#     share an instance. Trade-off: wall time ~doubles to ~25-45 min for 44 chains × ~1-2 min
#     (worst case a few 12-min jobs), which is still well inside the night even for the 01:00
#     UTC retry schedule.
#   • fail-fast: false — one red chain never cancels the rest.
#   • timeout-minutes: 12 — a chain's deadline is 240 s inside a 300 s function wall
#     (CHAIN_DEADLINE_MS / vercel.json); the runner's single-request cap is 290 s and it
#     retries once — after a FAST failure (<30 s, 15 s backoff) or after a PLATFORM CRASH
#     (FUNCTION_INVOCATION_FAILED / 502 / 503, 75 s backoff, at any elapsed time), so the
#     worst path (290 + 75 + 290 s ≈ 11 min) fits.
#   • a failed job = a red run = GitHub e-mails the workflow owner. That is the dead-man
#     alarm, with no new vendor. The `summary` job POSTs the per-chain outcome to
#     op=chainsummary (chains/<date>.json) so op=health / the UI banner can show WHICH chains
#     failed — and can tell when NO night was recorded at all (the only failure an e-mail
#     cannot deliver, because nothing ran to fail).
#
# SCHEDULE — 22:05 UTC daily, with RETRY schedules at 22:40, 23:20 and 01:00 UTC (the Vercel
# cron is daily: `0 22 * * *` in vercel.json). GitHub does not promise a schedule fires on
# time, and for this repo it has not: on 2026-10-02 the 13:30 evidence-tick fired at 18:38 and
# the 22:05 nightly had not fired by 22:53. Four independent schedules are four chances to land
# the night; the `preflight` job below makes them IDEMPOTENT — a run that finds the night
# already covered skips every chain job and the summary (one tiny job), and a run that finds a
# partial/red record re-runs only the chains that are not yet ok. All four land on the SAME ET
# session date: 01:00 UTC is 21:00 EDT / 20:00 EST, well before midnight in New York (04:00
# UTC EDT), and lib/chain-summary.js keys every record by the ET date for exactly this reason.
# No schedule after 01:00 — later than that the next morning's premarket readers would see a
# half-refreshed app, and the dead-man (op=health chains:no-matrix-run) has already alarmed.
# warm's first two steps are the cache warms (PATHS: backtests, screeners incl. the candle
# caches, sectors, optionsflow — ~22-30 s on three workers — plus the 3M/6M screener extras in
# the background), and those must land BEFORE `ledger`: op=track snapshots the Screener +
# Momentum picks from exactly those caches, and several roots (cfl, ephemeral, psrl) read the
# candle caches the screener warm rebuilds. The in-process dispatcher started wave 0 ~25 s in.
# GitHub's schedule lands 3-15 min late in practice, so `5 22` gives a hard floor of ≥5 min
# after the cron fired. With max-parallel 4 the run can overlap 22:30 (evidence-tick.yml, which
# relies on FMP being quiet); the FMP-heavy roots run in ROOT_CHAINS order (ticks1 early,
# altprobes mid-run, alphacal later) — if evidencetick's noNews 429s reappear, move those roots
# earlier in ROOT_CHAINS (the matrix preserves the module's order) rather than retiming this cron.
#
# ORDERING — `spine` (ledger → @decision → @reprime, the day's picks + decision snapshot + the
# re-primed op=today) runs FIRST; every other root `needs: spine`. In-process, the other roots
# raced the spine and several (evolve, challenger, bearcase, swing, atlasx, maturity, router)
# accepted reading a one-tick-stale op=today / scoreboard as a trade-off. Here they simply wait.
# A failed spine does NOT skip the rest (`if: !cancelled()`): their inputs are then stale, not
# absent, and their own ledgers must still advance.
#
# The matrices below are GENERATED from lib/warm-chains.js by scripts/gen-nightly-matrix.js
# and pinned by test/nightly-chains-matrix.test.js (spine ∪ chains == ROOT_CHAINS, in order).
# Adding a root to ROOT_CHAINS without re-running the generator fails CI.
#
# CUTOVER (docs/nightly-chains-matrix.md): api/warm.js keeps dispatching in-process until the
# Vercel env var WARM_CHAINS_INPROCESS=0 is set. Run this workflow by hand once
# (workflow_dispatch, optionally `only=maturity,bearcase` — cheap idempotent roots) and check
# op=health `chains.source == "github-matrix"` before flipping the env var.
#
# One-time setup: repo secret CRON_SECRET (same value as the Vercel Production env var) —
# already required by daytrade-scan.yml / evidence-tick.yml. Without it every job skips with
# a warning (exit 0) instead of failing red every night.

on:
  schedule:
    - cron: '5 22 * * *'    # primary: ≥5 min after the 22:00 UTC Vercel cache warm
    - cron: '40 22 * * *'   # retry 1: covers the usual 3-30 min schedule lag
    - cron: '20 23 * * *'   # retry 2: covers an hour-plus lag (observed 2026-10-02)
    - cron: '0 1 * * *'     # retry 3: last chance, still 21:00 EDT / 20:00 EST — same ET session date
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated root chains to run (default: all). First verification: e.g. 'maturity,bearcase'. A filtered run is recorded with source 'manual', partial:true, and never covers the night."
        required: false
        default: ''
      force:
        description: "true = run even if op=health already shows a full, clean run for tonight (the preflight otherwise skips)."
        required: false
        default: 'false'

env:
  APP_URL: https://market-news-app-chi.vercel.app
  OUT_DIR: .nightly

concurrency:
  group: nightly-chains
  cancel-in-progress: false

jobs:
  # IDEMPOTENCE GATE. Asks op=health (public GET, no bearer) what tonight already has and
  # emits `skip` (a full clean run exists → every job below is skipped) and `already_ok`
  # (chains an earlier run of this ET session completed → the runner reports them as
  # `already-ok` without a request). Fail-OPEN: a failed probe runs everything.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
      already_ok: ${{ steps.probe.outputs.already_ok }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - id: probe
        name: Ask op=health what tonight already has
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/nightly-chains-preflight.js

  spine:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # BEGIN GENERATED matrix:spine (scripts/gen-nightly-matrix.js — do not edit by hand)
        chain: [ledger]
        # END GENERATED matrix:spine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run chain ${{ matrix.chain }}
        if: github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), format(',{0},', matrix.chain))
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALREADY_OK: ${{ needs.preflight.outputs.already_ok }}
        run: node scripts/run-nightly-chain.js "${{ matrix.chain }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-${{ matrix.chain }}
          path: .nightly/${{ matrix.chain }}.json
          if-no-files-found: ignore
          retention-days: 7

  chains:
    needs: [preflight, spine]
    if: ${{ !cancelled() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # BEGIN GENERATED matrix:chains (scripts/gen-nightly-matrix.js — do not edit by hand)
        chain: [capture, ticks1, ticks2, ticks3, aligned, universe, pulse, router, maturity, researchgrade, evolve, swing, atlasx, rlt, altprobes, govdemand, gridlock, swingsearch, pattern, patternresearch, cfl, psrl, peerprop, expgap, pitdata, alphacal, gexa, vrp, ephemeral, optionsv2, pulse2, omegaab, swingverify, dilution, techev, stbull, bearcase, forecastshadow, insidercluster, delisting, optionsgex, housebook, challenger]
        # END GENERATED matrix:chains
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run chain ${{ matrix.chain }}
        if: github.event.inputs.only == '' || contains(format(',{0},', github.event.inputs.only), format(',{0},', matrix.chain))
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALREADY_OK: ${{ needs.preflight.outputs.already_ok }}
        run: node scripts/run-nightly-chain.js "${{ matrix.chain }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chain-${{ matrix.chain }}
          path: .nightly/${{ matrix.chain }}.json
          if-no-files-found: ignore
          retention-days: 7

  summary:
    # Always runs — a cancelled or timed-out chain job is exactly what must be recorded —
    # unless the preflight skipped the night (it is already recorded; nothing new to say).
    needs: [preflight, spine, chains]
    if: ${{ always() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: chain-*
          merge-multiple: true
          path: .nightly
      - name: Post the per-night chain summary (op=chainsummary)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ONLY: ${{ github.event.inputs.only }}
        run: node scripts/nightly-chains-summary.js
