name: Day Trade intraday scan

# EXTERNAL SCHEDULER for the Day Trade discovery engine (see DAYTRADE-PREDICTIVE.md).
# Vercel Hobby has no intraday cron, so GitHub Actions plays scheduler:
#
#   • every 5 min, 08:00–21:55 UTC weekdays → op=daytradescan (one locked, idempotent
#     scan cycle: Stage-A discovery + PIT dataset capture + health bookkeeping). The UTC
#     window covers 04:00 ET premarket → 16:00 ET close in BOTH EDT and EST; off-session
#     calls no-op server-side for pennies, and the runner's 40 s idempotency window +
#     55 s lease make over-scheduling safe.
#
#     THE CADENCE IS DELIVERED BY THE JOB, NOT BY THE CRON. Measured over 69 scheduled
#     runs, 2026-08-14 → 08-19: GitHub delivered 25/168, 24/168 and 11/168 of the */5
#     triggers on full days — ~15%, with a MEDIAN GAP OF 33 MIN (p90 47.5, max 60.5) and
#     the first run of the day landing ~08:40 against an 08:00 window. Every run
#     succeeded in 14–41 s, so nothing was queuing or failing: GitHub simply drops
#     high-frequency schedules. The app reported "Discovery is stale — the scheduler may
#     not be running" for most of every session as a direct result.
#
#     So one delivered trigger now POLLS for the rest of its window instead of doing a
#     single scan and exiting. The cron is only a way to get a runner; the runner is what
#     keeps the cadence. Coverage overlaps because the loop (55 min) outlasts the worst
#     observed trigger gap (60.5 min is the outlier; p90 is 47.5), and `concurrency` holds
#     at most one pending run, so a replacement is already waiting when a loop ends.
#     Minutes are free — this repository is public.
#   • every 10 min inside the same window → op=lowfloattick (the same-session low-float /
#     intraday-continuation stack: Stage-0 discovery, float + bar enrichment, structure,
#     actionability, research snapshots, point-in-time paper-entry events, alerts). It is
#     deliberately HALF the daytradescan cadence and self-skips outside regular hours
#     (returning in ~10 ms with no provider calls), because the full pipeline costs ~24
#     bulk-quote requests per run and this app has hit a provider plan limit before.
#   • 23:00 UTC weekdays (after the 22:00 UTC daily warm cron has rebuilt the candle
#     caches) → op=daytradecapture (runner-capture / miss-taxonomy report) + several
#     bounded op=datasetgrade passes (attach strictly-after labels to the day's rows),
#     then the low-float stack's own post-close chain: op=intradayresolve (resolve the
#     day's paper-entry events from the user-visible fill) → op=largemoveraudittick (why
#     each of the day's biggest movers was missed) → op=intradaypromote (recompute every
#     template's promotion state and apply automatic demotion).
#
# HONESTY: GitHub cron is best-effort — real cadence is ~5–15 min with jitter, and
# GitHub disables schedules in repos with no activity for 60 days. op=daytradescanhealth
# reports actual gaps, so coverage claims stay factual.
#
# One-time setup: add repo secret CRON_SECRET (same value as the Vercel Production env
# var). Until it exists, runs no-op with a warning instead of failing red every 5 min.

on:
  schedule:
    - cron: '*/5 8-21 * * 1-5'   # intraday scan window (UTC)
    - cron: '0 23 * * 1-5'       # post-close capture + dataset grading (UTC)
  workflow_dispatch: {}

env:
  APP_URL: https://market-news-app-chi.vercel.app

concurrency:
  group: daytrade-scan
  cancel-in-progress: false

jobs:
  scan:
    # Runs on the 5-minute schedule and on manual dispatch; not on the post-close tick.
    if: github.event.schedule != '0 23 * * 1-5'
    runs-on: ubuntu-latest
    # Must exceed LOOP_SECONDS plus one iteration's own curl budget (90+90+120 = 300 s),
    # or a healthy-but-slow final iteration fails the job on the runner's clock.
    timeout-minutes: 65
    steps:
      - name: Poll the scan / board / low-float ticks for this run's window
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ env.APP_URL }}
          # A manual dispatch does ONE pass and exits, so the workflow stays testable by
          # hand in seconds rather than occupying a runner for the better part of an hour.
          SINGLE_PASS: ${{ github.event_name != 'schedule' }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping scan. Add it (repo Settings → Secrets and variables → Actions) with the same value as the Vercel Production CRON_SECRET to enable intraday scanning."
            exit 0
          fi

          LOOP_SECONDS=3300      # 55 min of coverage per delivered trigger
          TICK_SECONDS=300       # the 5-min cadence the app actually asks for
          WINDOW_END_HOUR=22     # stop at 22:00 UTC — the daily warm cron owns what follows
          [ "$SINGLE_PASS" = "true" ] && LOOP_SECONDS=0

          started=$(date -u +%s)
          iter=0
          failures=0

          # One tick's worth of work. Never aborts the loop: a transient 5xx must not cost
          # the remaining 50 minutes of coverage. Failures are COUNTED and the job exits
          # non-zero at the end, so they stay as visible as when each was its own step —
          # this workflow has been bitten before by an unconditional-success suffix on a
          # curl swallowing exactly these.
          call() {   # call <label> <url> <max-time>
            local label="$1" url="$2" maxtime="$3" code
            code=$(curl -sS -o "/tmp/$label.json" -w '%{http_code}' --max-time "$maxtime" \
              -H "Authorization: Bearer $CRON_SECRET" "$url" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::op=$label returned HTTP $code (iteration $iter)"
              failures=$((failures+1))
              return 1
            fi
            if grep -q '"ok":false' "/tmp/$label.json"; then
              echo "::error::$label reported ok:false (iteration $iter)"
              failures=$((failures+1))
              return 1
            fi
            return 0
          }

          # Pretty-print a response without any unconditional-success suffix. The contract
          # tests assert that no such suffix appears anywhere in this job, because that is
          # exactly how real failures were swallowed here before — and a logging
          # convenience must never blunt that signal.
          summarize() {   # summarize <label> <jq-filter>
            if command -v jq >/dev/null 2>&1; then
              jq -c "$2" "/tmp/$1.json" 2>/dev/null
            fi
            return 0
          }

          while :; do
            iter=$((iter+1))
            echo "── iteration $iter · $(date -u +%H:%M:%S)Z ──"

            # Stage-A discovery + PIT capture + health bookkeeping.
            if call daytradescan "$APP_URL/api/tracker?op=daytradescan" 90; then
              summarize daytradescan '{ok, skipped, outcome, scanned, anomalies}'
            fi

            # The ONE authenticated lifecycle mutator (Stage-2 validation, lifecycle
            # advance, alert emission, persistence). The public op=daytrade is read-only.
            call daytradeboardtick "$APP_URL/api/tracker?op=daytradeboardtick&source=scheduler" 90

            # Low-float / intraday-continuation stack: deliberately HALF this cadence,
            # because the pipeline costs ~24 bulk-quote requests per run and this app has
            # hit a provider plan limit before. Gated on the ITERATION, not the wall clock:
            # inside a loop the clock minute drifts and would silently skip or double up.
            if [ $((iter % 2)) -eq 1 ]; then
              if call lowfloattick "$APP_URL/api/tracker?op=lowfloattick" 120; then
                summarize lowfloattick '{ok, skipped, reason, candidatesRanked, alertsEmitted, elapsedMs}'
              fi
            fi

            now=$(date -u +%s)
            hour=$(date -u +%H)
            elapsed=$((now - started))
            if [ "$LOOP_SECONDS" -eq 0 ]; then echo "single pass — done"; break; fi
            if [ "$elapsed" -ge "$LOOP_SECONDS" ]; then echo "loop budget reached after ${elapsed}s"; break; fi
            if [ "$((10#$hour))" -ge "$WINDOW_END_HOUR" ]; then echo "past ${WINDOW_END_HOUR}:00 UTC — leaving the rest to the daily cron"; break; fi

            # Sleep the remainder of the tick, so the cadence is 5 min end-to-end rather
            # than 5 min plus however long the calls took.
            spent=$(( $(date -u +%s) - now + 0 ))
            rest=$(( TICK_SECONDS - spent ))
            [ "$rest" -gt 0 ] && sleep "$rest"
          done

          echo "── completed $iter iteration(s), $failures failure(s) ──"
          [ "$failures" -eq 0 ] || exit 1

  postclose:
    # Post-close: capture report (public op) + bounded label-grading passes (privileged).
    if: github.event.schedule == '0 23 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner-capture / miss-taxonomy report
        run: |
          curl -sS --max-time 120 "$APP_URL/api/tracker?op=daytradecapture" | head -c 2000
      - name: Grade the day's PIT dataset rows (bounded passes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping dataset grading."
            exit 0
          fi
          # BACKLOG mode (no date param): each pass grades the oldest incomplete captured
          # dates first (≤40 tickers per date, ≤3 dates per pass), so a day that fell short
          # yesterday is retried until remaining=0, terminal, or past bar retention (~5d).
          # The top-level "remaining" in the response is the whole backlog's remaining count.
          for i in 1 2 3 4 5 6; do
            out=$(curl -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/tracker?op=datasetgrade&limit=40")
            echo "pass $i: $out" | head -c 1000; echo
            remaining=$(echo "$out" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ "${remaining:-0}" = "0" ]; then echo "grading complete"; break; fi
          done
      # LOW-FLOAT STACK POST-CLOSE CHAIN. Order matters and is not incidental:
      #   resolve  — turn the day's paper-entry events into outcomes measured from the
      #              simulated fill (needs the session's completed bars, so it must run
      #              after the close and before the audit reads the event log)
      #   audit    — rank the day's actual biggest movers and categorise every miss against
      #              the evidence trail the ticks wrote during the session
      #   promote  — recompute every template's promotion state over the whole outcome
      #              history and apply automatic demotion
      # Each step is tolerant of an empty day: with no events logged they return ok:true
      # with zero counts rather than failing.
      - name: Low-float post-close (resolve outcomes, audit misses, recompute promotion)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping the low-float post-close chain."
            exit 0
          fi
          for op in intradayresolve largemoveraudittick intradaypromote; do
            code=$(curl -sS -o "/tmp/$op.json" -w '%{http_code}' --max-time 180 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/tracker?op=$op")
            echo "--- $op (HTTP $code) ---"
            if command -v jq >/dev/null 2>&1; then
              jq -c 'del(.limitations, .versions, .flags)' "/tmp/$op.json" | head -c 1200; echo
            else
              tail -c 900 "/tmp/$op.json"; echo
            fi
            if [ "$code" != "200" ]; then
              echo "::error::op=$op returned HTTP $code"
              exit 1
            fi
          done
