name: Day Trade intraday scan

# EXTERNAL SCHEDULER for the Day Trade discovery engine (see DAYTRADE-PREDICTIVE.md).
# Vercel Hobby has no intraday cron, so GitHub Actions plays scheduler:
#
#   • every 5 min, 08:00–21:55 UTC weekdays → op=daytradescan (one locked, idempotent
#     scan cycle: Stage-A discovery + PIT dataset capture + health bookkeeping). The UTC
#     window covers 04:00 ET premarket → 16:00 ET close in BOTH EDT and EST; off-session
#     calls no-op server-side for pennies, and the runner's 40 s idempotency window +
#     55 s lease make over-scheduling safe.
#   • every 10 min inside the same window → op=lowfloattick (the same-session low-float /
#     intraday-continuation stack: Stage-0 discovery, float + bar enrichment, structure,
#     actionability, research snapshots, point-in-time paper-entry events, alerts). It is
#     deliberately HALF the daytradescan cadence and self-skips outside regular hours
#     (returning in ~10 ms with no provider calls), because the full pipeline costs ~24
#     bulk-quote requests per run and this app has hit a provider plan limit before.
#   • 23:00 UTC weekdays (after the 22:00 UTC daily warm cron has rebuilt the candle
#     caches) → op=daytradecapture (runner-capture / miss-taxonomy report) + several
#     bounded op=datasetgrade passes (attach strictly-after labels to the day's rows),
#     then the low-float stack's own post-close chain: op=intradayresolve (resolve the
#     day's paper-entry events from the user-visible fill) → op=largemoveraudittick (why
#     each of the day's biggest movers was missed) → op=intradaypromote (recompute every
#     template's promotion state and apply automatic demotion).
#
# HONESTY: GitHub cron is best-effort — real cadence is ~5–15 min with jitter, and
# GitHub disables schedules in repos with no activity for 60 days. op=daytradescanhealth
# reports actual gaps, so coverage claims stay factual.
#
# One-time setup: add repo secret CRON_SECRET (same value as the Vercel Production env
# var). Until it exists, runs no-op with a warning instead of failing red every 5 min.

on:
  schedule:
    - cron: '*/5 8-21 * * 1-5'   # intraday scan window (UTC)
    - cron: '0 23 * * 1-5'       # post-close capture + dataset grading (UTC)
  workflow_dispatch: {}

env:
  APP_URL: https://market-news-app-chi.vercel.app

concurrency:
  group: daytrade-scan
  cancel-in-progress: false

jobs:
  scan:
    # Runs on the 5-minute schedule and on manual dispatch; not on the post-close tick.
    if: github.event.schedule != '0 23 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger one locked scan cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping scan. Add it (repo Settings → Secrets and variables → Actions) with the same value as the Vercel Production CRON_SECRET to enable intraday scanning."
            exit 0
          fi
          code=$(curl -sS -o /tmp/scan.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/tracker?op=daytradescan")
          cat /tmp/scan.json
          if [ "$code" != "200" ]; then
            echo "::error::op=daytradescan returned HTTP $code"
            exit 1
          fi

      # BOARD TICK — advance the lifecycle + emit alerts WITHOUT requiring a browser.
      # op=daytradeboardtick is the ONE authenticated lifecycle mutator (Stage-2 validation,
      # lifecycle advance, alert emission, persistence, capture) — the public op=daytrade is
      # a read-only projection and cannot advance state. FAILURES ARE VISIBLE: a non-200, a
      # timeout, or ok:false (persistence/alert failure inside the tick) fails this step —
      # the old `|| true` swallowed every one of those and the scheduler read green.
      - name: Board tick (lifecycle advance + alert emission)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/board.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/tracker?op=daytradeboardtick&source=scheduler")
          head -c 600 /tmp/board.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::op=daytradeboardtick returned HTTP $code (lifecycle persistence or alert emission failed — see boardtick-health)"
            exit 1
          fi
          if grep -q '"ok":false' /tmp/board.json; then
            echo "::error::board tick reported ok:false"
            exit 1
          fi

      # LOW-FLOAT / INTRADAY-CONTINUATION TICK — the ONE writer for the same-session stack
      # (discovery state, research snapshots, paper-entry events, alerts). The public
      # op=lowfloat and op=intradaycontinuation are read-only projections and cannot write.
      #
      # Runs on even 10-minute boundaries only: GitHub fires this job every 5 minutes, and
      # the pipeline is roughly ten times the cost of a discovery scan. A skipped run is not
      # a failure — an off-session or odd-slot tick exits ~10 ms having called no provider.
      - name: Low-float ignition tick (every 10 min)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping the low-float tick."
            exit 0
          fi
          minute=$(date -u +%M)
          if [ $((10#$minute % 10)) -ne 0 ]; then
            echo "minute $minute is not a 10-minute boundary — skipping this slot"
            exit 0
          fi
          code=$(curl -sS -o /tmp/lowfloat.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/tracker?op=lowfloattick")
          head -c 800 /tmp/lowfloat.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::op=lowfloattick returned HTTP $code"
            exit 1
          fi
          if grep -q '"ok":false' /tmp/lowfloat.json; then
            echo "::error::low-float tick reported ok:false"
            exit 1
          fi

  postclose:
    # Post-close: capture report (public op) + bounded label-grading passes (privileged).
    if: github.event.schedule == '0 23 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner-capture / miss-taxonomy report
        run: |
          curl -sS --max-time 120 "$APP_URL/api/tracker?op=daytradecapture" | head -c 2000
      - name: Grade the day's PIT dataset rows (bounded passes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping dataset grading."
            exit 0
          fi
          # BACKLOG mode (no date param): each pass grades the oldest incomplete captured
          # dates first (≤40 tickers per date, ≤3 dates per pass), so a day that fell short
          # yesterday is retried until remaining=0, terminal, or past bar retention (~5d).
          # The top-level "remaining" in the response is the whole backlog's remaining count.
          for i in 1 2 3 4 5 6; do
            out=$(curl -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/tracker?op=datasetgrade&limit=40")
            echo "pass $i: $out" | head -c 1000; echo
            remaining=$(echo "$out" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ "${remaining:-0}" = "0" ]; then echo "grading complete"; break; fi
          done
      # LOW-FLOAT STACK POST-CLOSE CHAIN. Order matters and is not incidental:
      #   resolve  — turn the day's paper-entry events into outcomes measured from the
      #              simulated fill (needs the session's completed bars, so it must run
      #              after the close and before the audit reads the event log)
      #   audit    — rank the day's actual biggest movers and categorise every miss against
      #              the evidence trail the ticks wrote during the session
      #   promote  — recompute every template's promotion state over the whole outcome
      #              history and apply automatic demotion
      # Each step is tolerant of an empty day: with no events logged they return ok:true
      # with zero counts rather than failing.
      - name: Low-float post-close (resolve outcomes, audit misses, recompute promotion)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping the low-float post-close chain."
            exit 0
          fi
          for op in intradayresolve largemoveraudittick intradaypromote; do
            code=$(curl -sS -o "/tmp/$op.json" -w '%{http_code}' --max-time 180 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/tracker?op=$op")
            echo "--- $op (HTTP $code) ---"; head -c 800 "/tmp/$op.json"; echo
            if [ "$code" != "200" ]; then
              echo "::error::op=$op returned HTTP $code"
              exit 1
            fi
          done
