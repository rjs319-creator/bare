name: Evidence tick (Thesis Changes) + revarchive + estarchive + filing feeds

# EXTERNAL SCHEDULER for op=evidencetick (Evidence Consensus & Thesis Change engine).
# It used to run as a root chain inside the 22:00 UTC /api/warm burst, where every
# chain fires concurrently — altprobes alone drains ~450 sequential FMP calls — so
# the tick's 14 FMP/Finnhub news fetches were rate-limited into "noNews" daily and
# the Thesis Changes tab stayed empty. Running 30 min later lands in a quiet window.
#
# The op itself is idempotent per day (rewrites evidence/<date>.json) and no-ops on
# weekends/holidays server-side, so best-effort GitHub cron jitter is harmless.
#
# One-time setup: repo secret CRON_SECRET (same value as the Vercel Production env
# var) — already required by daytrade-scan.yml.

on:
  schedule:
    - cron: '30 22 * * 1-5'   # 30 min after the 22:00 UTC warm burst has drained
    - cron: '30 13 * * 1-5'   # pre-open second revarchive pull (plan caps 100 events/feed/pull — frequency IS the coverage)
  workflow_dispatch:
    inputs:
      force:
        description: "Set to 1 to run even when the market is closed (weekend verification)"
        required: false
        default: ''

env:
  APP_URL: https://market-news-app-chi.vercel.app

concurrency:
  group: evidence-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run one evidence tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repo secret not set — skipping evidence tick. Add it (repo Settings → Secrets and variables → Actions) with the same value as the Vercel Production CRON_SECRET."
            exit 0
          fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "1" ]; then FORCE="&force=1"; fi
          code=$(curl -sS -o /tmp/tick.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/tracker?op=evidencetick$FORCE")
          cat /tmp/tick.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::op=evidencetick returned HTTP $code"
            exit 1
          fi
      - name: Run revarchive (analyst-event archive)
        # Moved here from the 22:00 warm burst (same reason as evidencetick): the
        # burst 429s FMP for minutes, longer than any in-process retry can outlast
        # — revarchive lost its first two days to it. 22:30 is a quiet window.
        # Idempotent per day (rewrites revarchive/<date>.json; read-side dedup).
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          code=$(curl -sS -o /tmp/rev.json -w '%{http_code}' --max-time 120             -H "Authorization: Bearer $CRON_SECRET"             "$APP_URL/api/tracker?op=revarchive")
          cat /tmp/rev.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::op=revarchive returned HTTP $code"
            exit 1
          fi
      - name: Run estarchive (analyst-estimate vintages)
        # Post-close (22:30) run only — the vintage contract is ONE snapshot per
        # day; the 13:30 pre-open cron is revarchive coverage, not estimates.
        # Sequential after revarchive on purpose: never two FMP sweeps at once
        # (the altprobes burst-429 lesson). Plan-gated? The op records it as
        # gated:true with HTTP 200 and writes nothing — deterministic, no retry.
        if: github.event.schedule != '30 13 * * 1-5'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          code=$(curl -sS -o /tmp/est.json -w '%{http_code}' --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/tracker?op=estarchive")
          cat /tmp/est.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::op=estarchive returned HTTP $code"
            exit 1
          fi
      - name: Run filing feeds (8-K + insider archives)
        # Rolling market-wide feeds — what scrolls past uncaptured is gone, so
        # BOTH crons run them (frequency is the coverage; same-day merge dedups).
        # Light (≤16 calls each), sequential after the heavier sweeps on purpose.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          fail=0
          for op in sec8karchive insarchive; do
            code=$(curl -sS -o /tmp/$op.json -w '%{http_code}' --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/tracker?op=$op")
            cat /tmp/$op.json; echo
            if [ "$code" != "200" ]; then
              echo "::error::op=$op returned HTTP $code"
              fail=1
            fi
          done
          exit $fail
